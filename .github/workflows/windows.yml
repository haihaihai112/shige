name: Windows build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run tests and publish Windows x64
        run: ./scripts/Build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: Shige-win-x64
          path: artifacts/Shige-win-x64/
          if-no-files-found: error
          retention-days: 14
